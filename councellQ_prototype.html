    // --- API CONFIGURATION & CONTRACT MAPPINGS ---
    // When served by Express on port 5000, use relative '/api' route.
    // Otherwise fallback to http://localhost:5000/api for local static debugging.
    const API_BASE = window.location.origin.startsWith('http') ? '/api' : 'http://localhost:5000/api';

    // JEE Main labels and direct UPTAC codes mapping
    const CATEGORY_MAP = {
      'General':           'OPEN',
      'OBC-NCL':           'BC',
      'SC':                'SC',
      'ST':                'ST',
      'EWS':               'EWS(OPEN)',
      'General (Female)':  'OPEN(GIRL)',
      'OBC-NCL (Female)':  'BC(Girl)',
      'SC (Female)':       'SC(Girl)',
      'ST (Female)':       'ST(Girl)',
      'EWS (Female)':      'EWS(GL)',
      // Direct pass-throughs for raw UPTAC codes
      'OPEN':              'OPEN',
      'OPEN(GIRL)':        'OPEN(GIRL)',
      'BC':                'BC',
      'BC(Girl)':          'BC(Girl)',
      'EWS(OPEN)':         'EWS(OPEN)'
    };

    function resolveCategoryCode(category, gender) {
      if (category.includes('(Female)') || gender === 'Female-Only') {
        const base = category.replace(' (Female)', '');
        const femaleKey = `${base} (Female)`;
        if (CATEGORY_MAP[femaleKey]) return CATEGORY_MAP[femaleKey];
      }
      return CATEGORY_MAP[category] || category || 'OPEN';
    }

    function adaptApiResultToCollege(item, index) {
      return {
        id: `api_${item.institute}_${item.program}_${item.round}_${index}`.replace(/[^a-zA-Z0-9_]/g, '_'),
        name: item.institute,
        type: (item.institute.includes('University') || item.institute.includes('Institute of Technology')) ? 'State Govt' : 'Affiliated',
        location: 'Uttar Pradesh',
        state: 'Uttar Pradesh',
        nirfRank: 'UPTAC Cutoff Record',
        established: 'N/A',
        avgPackage: 'N/A (Historical Record)',
        highestPackage: 'N/A',
        placementRate: 'N/A',
        fees: 'UP Scale',
        match: item.chance === 'Safe' ? 94 : item.chance === 'Moderate' ? 76 : 48,
        categoryTier: item.chance.toUpperCase(),
        program: item.program,
        quota: item.quota,
        category: item.category,
        round: item.round,
        opening_rank: item.opening_rank,
        closing_rank: item.closing_rank,
        rank_gap: item.rank_gap,
        chance: item.chance,
        branches: [
          {
            name: item.program,
            cutoff2023: Math.round(item.closing_rank * 0.95),
            cutoff2024: Math.round(item.closing_rank * 0.98),
            cutoff2025: item.closing_rank
          }
        ]
      };
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [predictionLoading, setPredictionLoading] = useState(false);
      const [selectedCollege, setSelectedCollege] = useState(MOCK_COLLEGES[0]);
      const [compareList, setCompareList] = useState([MOCK_COLLEGES[0], MOCK_COLLEGES[1]]);
      const [filterTier, setFilterTier] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      // Real API Prediction State
      const [predictionResults, setPredictionResults] = useState(null);
      const [predictionError, setPredictionError] = useState(null);
      const [lastSearchMeta, setLastSearchMeta] = useState(null);

      // Form State
      const [formData, setFormData] = useState({
        exam: 'JEE Main',
        rank: '45000',
        category: 'General',
        homeState: 'Uttar Pradesh',
        gender: 'Gender-Neutral',
        counselling: 'All India',
        branch: 'All Branches',
        locations: ['Uttar Pradesh', 'Delhi']
      });

      // Chatbot State
      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: 'Hello Aryan! I am your CounsellQ AI Assistant. How can I help you choose the right college today?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, filterTier, predictionLoading, predictionResults]);

      const handlePredict = async () => {
        setPredictionLoading(true);
        setPredictionError(null);

        const rankNum = parseInt(formData.rank, 10);
        if (isNaN(rankNum) || rankNum < 1) {
          setPredictionError("Please enter a valid positive rank (e.g. 45000).");
          setPredictionLoading(false);
          setActiveTab('results');
          return;
        }

        const resolvedCategory = resolveCategoryCode(formData.category, formData.gender);
        const payload = {
          rank: rankNum,
          category: resolvedCategory
        };

        if (formData.branch && formData.branch !== 'All Branches') {
          payload.program = formData.branch;
        }

        if (formData.homeState === 'Uttar Pradesh') {
          payload.quota = 'Home State';
        }

        try {
          const response = await fetch(`${API_BASE}/predict`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            setPredictionError(data.error || 'Prediction service returned an error. Please try again.');
            setPredictionResults(null);
          } else {
            setPredictionResults(data);
            setLastSearchMeta({
              rank: rankNum,
              category: resolvedCategory,
              categoryLabel: formData.category,
              branch: formData.branch || 'All Branches',
              homeState: formData.homeState,
              exam: formData.exam
            });
          }
          setActiveTab('results');
        } catch (err) {
          console.error("Prediction fetch failed:", err);
          setPredictionError("Could not connect to CounsellQ backend API. Please ensure the backend server is running on port 5000.");
          setPredictionResults(null);
          setActiveTab('results');
        } finally {
          setPredictionLoading(false);
        }
      };

      const handleCompareToggle = (college) => {
        if (compareList.some(c => c.id === college.id)) {
          setCompareList(compareList.filter(c => c.id !== college.id));
        } else if (compareList.length < 3) {
          setCompareList([...compareList, college]);
        } else {
          alert('You can compare a maximum of 3 colleges side by side.');
        }
      };

      const handleSendMessage = (textToSend) => {
        const query = textToSend || chatInput;
        if (!query.trim()) return;

        const newMessages = [...chatMessages, { sender: 'user', text: query }];
        setChatMessages(newMessages);
        if (!textToSend) setChatInput('');

        setTimeout(() => {
          let botReply = "Based on your JEE Main rank of 45,000 in the General category, you have strong chances in top AKTU colleges like GL Bajaj and AKGEC for CSE. For NIT Allahabad and DTU, lower or core branches might be accessible in later rounds.";
          if (query.toLowerCase().includes('cse') || query.toLowerCase().includes('it')) {
            botReply = "Both CSE and IT have nearly identical placement statistics (~90%+ placements). Choose CSE if you want broader foundational theory, or IT if you prefer software engineering and systems specialization.";
          } else if (query.toLowerCase().includes('placement') || query.toLowerCase().includes('package')) {
            botReply = "Top placed options in your range: IIIT Allahabad leads with ₹25.8 LPA average package, followed by MNNIT Allahabad at ₹20.3 LPA and DTU at ₹17.9 LPA.";
          }
          setChatMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
        }, 600);
      };

      return (
        <div class="min-h-screen flex flex-col justify-between">

                <div>

                <button onClick={() => setActiveTab('results')} class={`px-3 py-2 rounded-lg transition ${activeTab === 'results' ? 'text-indigo-600 bg-indigo-50 font-semibold' : 'hover:text-slate-900 hover:bg-slate-100'}`}>Predictions Dashboard</button>
                <button onClick={() => setActiveTab('explorer')} class={`px-3 py-2 rounded-lg transition ${activeTab === 'explorer' ? 'text-indigo-600 bg-indigo-50 font-semibold' : 'hover:text-slate-900 hover:bg-slate-100'}`}>Explore</button>
                <button onClick={() => setActiveTab('compare')} class={`px-3 py-2 rounded-lg transition ${activeTab === 'compare' ? 'text-indigo-600 bg-indigo-50 font-semibold' : 'hover:text-slate-900 hover:bg-slate-100'}`}>Compare ({compareList.length})</button>
                <button onClick={() => setActiveTab('assistant')} class={`px-3 py-2 rounded-lg transition ${activeTab === 'assistant' ? 'text-indigo-600 bg-indigo-50 font-semibold' : 'hover:text-slate-900 hover:bg-slate-100'}`}>AI Assistant</button>
                <button onClick={() => setActiveTab('dashboard')} class={`px-3 py-2 rounded-lg transition ${activeTab === 'dashboard' ? 'text-indigo-600 bg-indigo-50 font-semibold' : 'hover:text-slate-900 hover:bg-slate-100'}`}>My Profile</button>
              </nav>

              {/* Header Action Button */}
              <button 
                onClick={() => setActiveTab('predict')} 
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow-md shadow-indigo-100 transition flex items-center gap-2"

              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

            {/* ----------------- PAGE 1: LANDING PAGE ----------------- */}
            {activeTab === 'home' && (
              <div class="space-y-16">
                
                {/* Hero Section */}
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center pt-4">
                  <div class="lg:col-span-7 space-y-6 text-left">

                    </div>
                    <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">

                    <p class="text-lg text-slate-600 leading-relaxed max-w-2xl">
                      Enter your entrance rank, category, and preferred branches. CounsellQ analyzes historical cutoff trends across top Indian institutions to generate personalized Safe, Moderate, and Ambitious college options.
                    </p>
                    <div class="flex flex-wrap items-center gap-4 pt-2">
                      <button onClick={() => setActiveTab('predict')} class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition flex items-center gap-2">

                  {/* Right Preview Card */}

                    <div class="flex items-center gap-3 pb-4 border-b border-slate-100">

                      <div>
                        <h4 class="font-bold text-slate-900 text-sm">Aryan Yadav</h4>

                <div>
                  <h2 class="text-2xl font-bold text-slate-900">College Admission Predictor</h2>

                {/* Step 1: Exam */}

                {/* Step 2: Details */}

                        </tr>
                        <tr>
                          <td class="p-4 font-medium text-slate-500 bg-slate-50/50">Annual Fees</td>
                          {compareList.map(c => <td key={c.id} class="p-4">{c.fees}</td>)}
                        </tr>
                        <tr>
                          <td class="p-4 font-medium text-slate-500 bg-slate-50/50">Predicted Match</td>
                          {compareList.map(c => <td key={c.id} class="p-4"><span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 font-bold rounded-lg text-xs">{c.match}% Match</span></td>)}
                        </tr>
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* ----------------- PAGE 7: DASHBOARD ----------------- */}
            {activeTab === 'dashboard' && (
              <div class="space-y-6">
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex items-center justify-between">
                  <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-indigo-600 text-white font-extrabold text-xl flex items-center justify-center">AY</div>
                    <div>
                      <h2 class="text-xl font-bold text-slate-900">Aryan Yadav</h2>
                      <p class="text-xs text-slate-500">JEE Main 2026 • Rank: 45,000 • General Category</p>
                    </div>
                  </div>
                  <span class="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-xs rounded-full">Profile Ready</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Checklist Card */}
                  <div class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
                    <h3 class="font-bold text-slate-900 text-base">Counselling Preparation Checklist</h3>
                    <div class="space-y-2.5 text-xs">
                      <div class="flex items-center gap-2 text-emerald-700 font-semibold bg-emerald-50 p-2.5 rounded-xl">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>Rank & Domicile Details Verified</span>
                      </div>
                      <div class="flex items-center gap-2 text-emerald-700 font-semibold bg-emerald-50 p-2.5 rounded-xl">
                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                        <span>Branch Preferences Configured</span>
                      </div>
                      <div class="flex items-center gap-2 text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                        <div class="w-4 h-4 rounded-full border-2 border-slate-300"></div>
                        <span>Finalize Lock Choice Order</span>
                      </div>
                      <div class="flex items-center gap-2 text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                        <div class="w-4 h-4 rounded-full border-2 border-slate-300"></div>
                        <span>Track JOSAA Round 1 Seat Allotment</span>
                      </div>
                    </div>
                  </div>

                  {/* Saved Summary */}
                  <div class="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
                    <h3 class="font-bold text-slate-900 text-base">Saved & Tracked Items</h3>
                    <div class="grid grid-cols-2 gap-3 text-center">
                      <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                        <p class="text-2xl font-bold text-slate-900">12</p>
                        <p class="text-xs text-slate-500 mt-1">Predicted Options</p>
                      </div>
                      <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                        <p class="text-2xl font-bold text-indigo-600">{compareList.length}</p>
                        <p class="text-xs text-slate-500 mt-1">Colleges in Compare</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ----------------- PAGE 8: AI ASSISTANT ----------------- */}
            {activeTab === 'assistant' && (
              <div class="max-w-3xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-xl flex flex-col h-[600px] overflow-hidden">
                {/* Assistant Header */}
                <div class="bg-slate-900 text-white p-4 flex items-center gap-3">
                  <div class="p-2 bg-indigo-600 rounded-xl">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="font-bold text-sm">Ask CounsellQ AI</h3>
                    <p class="text-[11px] text-slate-400">Rule-based guidance assistant for college choices</p>
                  </div>
                </div>

                {/* Messages Body */}
                <div class="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50">
                  {chatMessages.map((msg, idx) => (
                    <div key={idx} class={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div class={`max-w-[80%] p-3.5 rounded-2xl text-xs leading-relaxed ${msg.sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none shadow-sm'}`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Suggested Chips */}
                <div class="px-4 py-2 bg-white border-t border-slate-100 flex gap-2 overflow-x-auto text-[11px]">
                  <button onClick={() => handleSendMessage("What colleges can I get with my rank?")} class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full whitespace-nowrap">
                    Colleges for my rank?
                  </button>
                  <button onClick={() => handleSendMessage("Should I choose CSE or IT?")} class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full whitespace-nowrap">
                    CSE vs IT?
                  </button>
                  <button onClick={() => handleSendMessage("Which colleges have better placements?")} class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full whitespace-nowrap">
                    Best placements?
                  </button>
                </div>

                {/* Chat Input */}
                <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
                  <input 
                    type="text" 
                    placeholder="Ask a question about counselling or cutoffs..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                    class="flex-grow px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                  <button 
                    onClick={() => handleSendMessage()} 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2.5 rounded-xl text-xs transition"
                  >
                    Send
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <p>© 2026 CounsellQ Frontend Prototype • All mock data shown is for visual demonstration purposes.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
